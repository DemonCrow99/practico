<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/logos/Arcalogo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/panel.css">
    <title>Iniciar sesión - ARCA</title>
</head>
<body class="pagina-auth">

    <main class="login-wrap">
        <div class="login-card">
            <div class="text-center mb-4">
                <img src="../assets/logos/Arcalogo.png" alt="ARCA" class="mb-3">
                <h1 class="login-titulo m-0">Iniciar sesión</h1>
                <p class="m-0 mt-2" style="opacity:.7; font-size:14px;">Ingresá a tu cuenta de la biblioteca</p>
            </div>

            <div id="login-alerta" class="alert alert-danger py-2 d-none" role="alert"></div>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label for="login-nombre">Usuario</label>
                    <input type="text" id="login-nombre" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-arca w-100">Ingresar</button>
            </form>

            <div class="text-center mt-4">
                <a href="../../index.html" class="link-volver">&larr; Volver al inicio</a>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
